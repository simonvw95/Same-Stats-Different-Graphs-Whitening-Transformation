<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
    <title>Same Stats, Different Graphs Made Simple and Fast by Linear Transformations</title>

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2025.3.1/core.js"></script>
			
	<py-config>
		packages = ["opencv-python", "numpy", "pandas", "matplotlib", "pillow"]
	</py-config>

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
			overflow: hidden;

            display: grid;
            grid-template-rows: 80px 1fr;
        }

        header {
            background: #2c3e50;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;
        }

		#main {
			display: grid;
			grid-template-columns: 1fr 1fr;
			height: calc(100vh - 80px);
		}

        /* Left panel */

		#left-panel {
			display: flex;
			flex-direction: column;
			overflow: hidden;
			height: 100%;
			padding: 20px;
			box-sizing: border-box;
			min-height: 0;
		}

        #parameter-section {

        }
		
		#controls-section {
			flex: 0 0 auto;
		}
		
		#output-section {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		
		#processed-image,
		#scatter-image {
			width: 100%;
			max-width: 100%;

			max-height: 100%;

			object-fit: contain;

			display: none;
		}

        label {
            font-size: 18px;
            font-weight: bold;
        }

        .description {
            margin-top: 8px;
            margin-bottom: 15px;
            color: #444;
        }

        input[type="number"] {

            width: 120px;
            padding: 8px;

            font-size: 18px;
        }

        /* Bottom button */

        input[type="file"] {
            display: none;
        }

        #upload-button {

            padding: 14px 26px;
            font-size: 18px;

            cursor: pointer;
        }
		
		#upload-section {
			flex: 0 0 auto;
			padding-top: 10px;
			display: flex;
			justify-content: center;
		}

        /* Right panel */

		#right-panel {
			display: flex;
			flex-direction: column;
			padding: 20px;
			box-sizing: border-box;
			overflow: hidden;
		}

		#target-statistics-section {
			flex: 0 0 auto;
		}

		#target-statistics-section h2 {
			margin-top: 0;
			margin-bottom: 20px;
			font-size: 24px;
			text-align: center;
		}

		#statistics-grid {
			display: flex;
			justify-content: center;
			align-items: flex-end;
			gap: 12px;
			max-width: 100%;
			margin: 0 auto;
		}

		.target-stat {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 6px;
		}

		.target-stat label {
			font-size: 16px;
			font-weight: bold;
			text-align: center;
			white-space: nowrap;
		}

		.target-stat input[type="number"] {
			width: 110px;
			padding: 8px;
			font-size: 17px;
			box-sizing: border-box;
			text-align: center;
		}

		#target-statistics-output {
			margin-top: 20px;
			flex: 1;
			min-height: 0;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		
		#transform-button {
			display: block;
			margin: 25px auto 0 auto;
			padding: 12px 24px;
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
		}

		#transform-button:disabled {
			cursor: not-allowed;
			opacity: 0.5;
		}

        #image-placeholder {

            width: 90%;
            height: 90%;

            border: 3px dashed #bbbbbb;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #777777;
            font-size: 24px;
        }
		
		.image-container {
			flex: 1;
			min-height: 0;

			display: flex;
			justify-content: center;
			align-items: center;
		}
		
		.image-container img {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
		}

    </style>

</head>

<body>

<header>

    <p>Same Stats, Different Graphs Made Simple and Fast by Linear Transformations <br>
	Give the page a few seconds to load the Python environment
	</p>

</header>

<div id="main">

    <div id="left-panel">
		
		<div id="controls-section">
			<div id="parameter-section">

				<label for="parameter">
					Number of points to extract from the uploaded image.
				</label>

				<div class="description">
					Enter an integer between <b>50</b> and <b>10000</b>.
				</div>

				<input
					id="parameter"
					type="number"
					min="50"
					max="10000"
					value="800">

			</div>
		</div>
		<div id="output-section">
		
			<div class="image-container">
				<img 
					id="processed-image"
					src="ghost2.png"
					style="display: block;"/>
			</div>
			
			<div class="image-container">
				<img 
					id="scatter-image" 
					src="ghost2_850.png"
					style="display: block;"/>
			</div>
			
		</div>

        <div id="upload-section">

            <label id="upload-button" for="imageUpload">
                Upload Image (.png/jpg/jpeg only). Simple contrast images work best.
            </label>

            <input
                id="imageUpload"
                type="file"
                accept=".png,.jpg,.jpeg,image/png,image/jpeg"
				py-change="upload_image">

        </div>

    </div>

	<div id="right-panel">

		<div id="target-statistics-section">

			<h2>Target Summary Statistics</h2>

			<div id="statistics-grid">

				<div class="target-stat">
					<label for="target-x-mean">X Mean</label>
					<input
						id="target-x-mean"
						type="number"
						step="any"
						value="54.265">
				</div>

				<div class="target-stat">
					<label for="target-y-mean">Y Mean</label>
					<input
						id="target-y-mean"
						type="number"
						step="any"
						value="47.835">
				</div>

				<div class="target-stat">
					<label for="target-x-sd">X Standard Deviation</label>
					<input
						id="target-x-sd"
						type="number"
						step="any"
						value="16.765">
				</div>

				<div class="target-stat">
					<label for="target-y-sd">Y Standard Deviation</label>
					<input
						id="target-y-sd"
						type="number"
						step="any"
						value="26.935">
				</div>

				<div class="target-stat">
					<label for="target-correlation">
						Pearson Correlation
					</label>
					<input
						id="target-correlation"
						type="number"
						step="0.1"
						min="-0.99"
						max="0.99"
						value="-0.065">
				</div>
				
				<button
					id="transform-button">
					Transform Dataset
				</button>

			</div>

		</div>	
		
		<div id="target-statistics-output">
			<img
				id="transformed-image"
				src="ghost2_post_850.png"
				style="
					max-width: 90%;
					max-height: 90%;
					object-fit: contain;
					display: block;"
			/>

		</div>
		
		

	</div>

</div>

<py-script src="script.py?v=timestamp"></py-script>
</body>

</html>
